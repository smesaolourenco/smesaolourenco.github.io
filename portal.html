<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>

body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#1b5e20,#2e7d32);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}

.download-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 16px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.download-btn:hover{background:#1b5e20}
.empty{text-align:center;padding:32px;color:#aaa;font-size:14px}
.error{color:#c62828;font-size:13px;margin-top:8px;text-align:center}
.loading{text-align:center;padding:20px;color:#2e7d32}
.footer{margin-top:32px;text-align:center;color:rgba(255,255,255,.6);font-size:12px}

</head>
<body>

<div class="card">
  <div class="logo">
    <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1b5e20,#388e3c);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:28px">🎓</div>
    <h1>Portal de Certificados</h1>
    <p>Secretaria Municipal de Educação<br>São Lourenço do Oeste — SC</p>

  <div id="code-banner" style="display:none;background:#e8f5e9;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#1b5e20;font-weight:600;text-align:center"></div>

  <div>
    <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:6px">Seus certificados</label>
    <label for="cpf-input" style="font-size:12px;color:#777;display:block;margin-bottom:4px">CPF</label>
    <input id="cpf-input" class="inp" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="off" oninput="formatCPF(this)" onkeydown="if(event.key==='Enter')document.getElementById('nasc-input').focus()">
    <label for="nasc-input" style="font-size:12px;color:#777;display:block;margin:12px 0 4px">Senha</label>
    <div style="position:relative">
      <input id="nasc-input" class="inp" type="password" inputmode="numeric" placeholder="Somente números" maxlength="8" autocomplete="off" oninput="formatData(this)" onkeydown="if(event.key==='Enter')buscarCertificados()" style="padding-right:44px">
      <button type="button" onclick="var i=document.getElementById('nasc-input');i.type=i.type==='password'?'text':'password';" aria-label="Mostrar senha" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:16px;color:#aaa">👁</button>
    </div>

    <button class="btn" onclick="buscarCertificados()" id="btn-buscar">🔍 Buscar Certificados</button>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin:26px 0 16px;color:#aaa;font-size:12px">
    <div style="flex:1;height:1px;background:#e0e0e0"></div>ou<div style="flex:1;height:1px;background:#e0e0e0"></div>

  <div>
    <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:6px">Validar um certificado pelo código</label>
    <input id="codigo-input" class="inp" type="text" placeholder="Ex.: 2025-0001-ABC" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')validarCodigoDigitado();">
    <div style="font-size:11px;color:#999;margin-top:4px">O código está impresso no certificado, junto ao QR Code.</div>

    <button class="btn" onclick="validarCodigoDigitado()" id="btn-validar" style="background:#fff;color:#1b5e20;border:2px solid #2e7d32">🔑 Validar Certificado</button>

<script>
var SUPA_URL='https://jabgimlqhgsmaoncfaon.supabase.co';
var SUPA_KEY='sb_publishable_pdd6Ur198pja2PCgXjrZvg_TkITQdpU';

function formatCPF(el){
  var v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>9) v=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if(v.length>6) v=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if(v.length>3) v=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  el.value=v;
}

// Senha = data de nascimento só com números (DDMMAAAA), mesmo padrão da Betha
function formatData(el){
  el.value=el.value.replace(/\D/g,'').slice(0,8);
}

// DDMMAAAA -> aaaa-mm-dd (ou '' se inválida)
function dataISO(txt){
  var m=/^(\d{2})(\d{2})(\d{4})$/.exec(String(txt||'').replace(/\D/g,''));
  if(!m) return '';
  var d=+m[1], mo=+m[2], a=+m[3];
  var dt=new Date(a,mo-1,d);
  if(dt.getFullYear()!==a||dt.getMonth()!==mo-1||dt.getDate()!==d) return '';
  if(a<1900||dt>new Date()) return '';
  return m[3]+'-'+m[2]+'-'+m[1];
}

// Chamada às funções do banco (o portal não lê tabelas diretamente)
function rpc(nome, params){
  return fetch(SUPA_URL+'/rest/v1/rpc/'+nome,{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(params)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(t);});
    return r.json();
  });
}

var MSG_INVALIDO='CPF ou senha não conferem. Verifique os dados digitados. Se estiverem corretos, procure a Secretaria Municipal de Educação.';
var MSG_BLOQUEADO='Muitas tentativas com este CPF. Por segurança, aguarde 15 minutos e tente novamente.';

function buscarCertificados(){
  var cpf=document.getElementById('cpf-input').value.replace(/\D/g,'');
  var nasc=dataISO(document.getElementById('nasc-input').value);
  var errEl=document.getElementById('error-msg');
  var resultsEl=document.getElementById('results');
  errEl.style.display='none';
  window._certs=null; window._cred=null;

  if(cpf.length!==11){
    errEl.textContent='Por favor, digite um CPF válido com 11 dígitos.';
    errEl.style.display='block';
    return;
  }
  if(!nasc){
    errEl.textContent='Digite sua senha com 8 números.';
    errEl.style.display='block';
    return;
  }

  var btn=document.getElementById('btn-buscar');
  btn.disabled=true;
  btn.textContent='⏳ Buscando...';
  resultsEl.style.display='block';
  resultsEl.innerHTML='<div class="loading">⏳ Buscando seus certificados...</div>';

  rpc('portal_certificados',{p_cpf:cpf,p_nascimento:nasc})
  .then(function(res){
    btn.disabled=false;
    btn.textContent='🔍 Buscar Certificados';

    if(!res||res.status!=='ok'){
      resultsEl.style.display='none';
      errEl.textContent=(res&&res.status==='bloqueado')?MSG_BLOQUEADO:MSG_INVALIDO;
      errEl.style.display='block';
      return;
    }
    var certs=res.certificados||[];
    if(!certs.length){
      resultsEl.innerHTML='<div class="empty">📋 Nenhum certificado encontrado.<br><small>Se você participou de uma formação, aguarde a emissão pela SME.</small></div>';
      return;
    }

    var html='<div style="font-size:13px;color:#2e7d32;font-weight:600;margin-bottom:12px">✅ '+certs.length+' certificado(s) encontrado(s) para:<br><span style="font-size:15px;color:#333">'+escHtml(certs[0].teacher_name)+'</span></div>';
    certs.forEach(function(cert,i){
      html+='<div class="cert-card">'+
        '<h3>📜 '+escHtml(cert.event_name||'Formação')+'</h3>'+
        '<div class="meta">'+
          '<span>⏱ '+escHtml(cert.hours)+'h</span>'+
          '<span>📅 '+escHtml(cert.issue_date||'')+'</span>'+
          (cert.validation_code?'<span>🔑 '+escHtml(cert.validation_code)+'</span>':'')+
        '</div>'+
        '<button class="download-btn" onclick="downloadCert('+i+',this)">⬇️ Baixar PDF</button>'+
      '</div>';
    });
    resultsEl.innerHTML=html;
    window._certs=certs;
    window._cred={cpf:cpf,nasc:nasc};
  })
  .catch(function(err){
    btn.disabled=false;
    btn.textContent='🔍 Buscar Certificados';
    resultsEl.innerHTML='<div class="empty">❌ Erro ao buscar certificados. Tente novamente.</div>';
    console.error(err);
  });
}

function escHtml(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Validação por código (QR) ──────────────────────────────────────────────
// Ao abrir o portal, se a URL tiver ?codigo=XXXX, busca e mostra aquele certificado direto.
function _getParam(name){
  var m=new RegExp('[?&]'+name+'=([^&]+)').exec(window.location.search||'');
  return m?decodeURIComponent(m[1]):'';
}

function validarPorCodigo(codigo){
  var resultsEl=document.getElementById('results');
  resultsEl.style.display='block';
  resultsEl.innerHTML='<div class="loading">⏳ Validando certificado...</div>';
  var lbl=document.getElementById('code-banner');
  if(lbl){lbl.style.display='block';lbl.textContent='🔑 Validando código: '+codigo;}

  rpc('portal_validar',{p_codigo:codigo})
  .then(function(cert){
    if(!cert){
      resultsEl.innerHTML='<div class="empty">⚠️ Nenhum certificado encontrado com o código <b>'+escHtml(codigo)+'</b>.<br><small>Confira se o código foi digitado exatamente como está no certificado.</small></div>';
      return;
    }
    var html='<div style="background:#e8f5e9;border:1px solid #a5d6a7;border-radius:12px;padding:14px 18px;margin-bottom:16px">'+
      '<div style="font-size:14px;color:#1b5e20;font-weight:700;margin-bottom:4px">✅ Certificado autêntico</div>'+
      '<div style="font-size:12px;color:#555">Este código consta na base da Secretaria Municipal de Educação.</div>'+
      '</div>';
    html+='<div class="cert-card">'+
      '<h3>📜 '+escHtml(cert.event_name||'Formação')+'</h3>'+
      '<p style="font-size:14px;color:#333;font-weight:600">'+escHtml(cert.teacher_name||'')+'</p>'+
      '<div class="meta">'+
        '<span>⏱ '+escHtml(cert.hours)+'h</span>'+
        '<span>📅 '+escHtml(cert.issue_date||'')+'</span>'+
        '<span>🔑 '+escHtml(cert.validation_code||'')+'</span>'+
      '</div>'+
      '<p style="font-size:12px;color:#555;margin-top:10px;line-height:1.5">Para obter a cópia do certificado, o titular deve acessar este portal com seu CPF e senha.</p>'+
    '</div>';
    resultsEl.innerHTML=html;
  })
  .catch(function(err){
    resultsEl.innerHTML='<div class="empty">❌ Erro ao validar o certificado. Tente novamente.</div>';
    console.error(err);
  });
}

// Validação digitada: mesmo fluxo do QR, para quem tem só o código impresso.
function validarCodigoDigitado(){
  var el=document.getElementById('codigo-input');
  var errEl=document.getElementById('codigo-error');
  var codigo=(el.value||'').toUpperCase().replace(/\s+/g,'');
  el.value=codigo;
  errEl.style.display='none';
  if(codigo.length<8){
    errEl.textContent='Digite o código de validação completo, como impresso no certificado.';
    errEl.style.display='block';
    return;
  }
  validarPorCodigo(codigo);
  var r=document.getElementById('results');
  if(r&&r.scrollIntoView) r.scrollIntoView({behavior:'smooth',block:'start'});
}

window.addEventListener('DOMContentLoaded',function(){
  var codigo=_getParam('codigo');
  if(codigo){ validarPorCodigo(codigo); }
});

// ── Download do certificado ────────────────────────────────────────────────
// O PDF é gerado aqui mesmo (html2canvas + jsPDF), sem a tela de impressão do
// navegador. Motivo: no celular a impressão escurecia a página (modo escuro),
// redistribuía os textos (tela estreita) e ignorava a orientação paisagem.
// Cada folha (.pg e .p2) vira UMA imagem numa folha A4 paisagem — o verso nunca
// é dividido (o _p2Fit do administrativo já grava o ajuste para caber em 1 folha).
var LIB_H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
var LIB_JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var CERT_FONTS='https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700&family=Lora:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap';
var CERT_LARGURA_PX=1123; // 297mm em px CSS — mesma largura usada na emissão

function _carregarScript(url, doc){
  doc=doc||document;
  return new Promise(function(ok,falha){
    var s=doc.createElement('script');
    s.src=url; s.onload=ok;
    s.onerror=function(){falha(new Error('Falha ao carregar '+url));};
    (doc.head||doc.documentElement).appendChild(s);
  });
}

function _comTempo(prom, ms, msg){
  return Promise.race([prom, new Promise(function(_,falha){setTimeout(function(){falha(new Error(msg||'Tempo esgotado'));},ms);})]);
}

function _nomeArquivo(nome){
  var n=String(nome||'certificado').replace(/[\\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim();
  return 'Certificado - '+(n||'certificado')+'.pdf';
}

function downloadCert(idx, btn){
  var cert=window._certs&&window._certs[idx];
  var cred=window._cred;
  if(!cert||!cred){ alert('Faça a busca novamente.'); return; }
  var txtOriginal=btn?btn.innerHTML:'';
  function restaura(){ if(btn){btn.disabled=false;btn.innerHTML=txtOriginal;} }
  if(btn){btn.disabled=true;btn.innerHTML='⏳ Gerando PDF...';}
  _limparAvisoImpressao(btn);

  rpc('portal_certificado_download',{p_id:String(cert.id),p_cpf:cred.cpf,p_nascimento:cred.nasc})
  .then(function(res){
    if(!res||res.status!=='ok'||!res.cert_html){
      restaura();
      if(res&&res.status==='bloqueado') alert(MSG_BLOQUEADO);
      else alert('Certificado ainda não disponível para download. Por favor, solicite à SME.');
      return;
    }
    return _gerarPdf(res, res.bg_data||'')
      .then(function(){ restaura(); })
      .catch(function(err){
        // Plano B: se a geração falhar (biblioteca não carregou, rede da escola etc.),
        // oferece o método de impressão. Precisa de um novo toque, senão o
        // navegador bloqueia a janela como pop-up.
        console.error('[portal] geração do PDF falhou, oferecendo impressão:',err);
        restaura();
        _mostrarAvisoImpressao(btn, res, res.bg_data||'');
      });
  })
  .catch(function(err){
    restaura();
    alert('Erro ao baixar o certificado. Tente novamente.');
    console.error(err);
  });
}

// Documento completo do certificado, sempre claro e com largura fixa de A4 deitado.
function _htmlCertificado(cert, bgData, extraHead, extraBody){
  var bgCss = bgData ? '.pg{background-image:url(\''+bgData+'\');background-size:100% 100%;background-position:center;background-repeat:no-repeat}' : '';
  return '<!DOCTYPE html><html><head>'+
    '<meta charset="UTF-8">'+
    '<meta name="color-scheme" content="light only">'+
    '<meta name="viewport" content="width='+CERT_LARGURA_PX+'">'+
    '<title>Certificado — '+escHtml(cert.teacher_name)+'</title>'+
    '<link href="'+CERT_FONTS+'" rel="stylesheet">'+
    '<style>'+
    ':root{color-scheme:light only}'+
    'html,body{margin:0;padding:0;background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    'body{width:297mm}'+
    '@media print{@page{size:A4 landscape;margin:0}body{margin:0}.sme-aviso{display:none!important}}'+
    bgCss+
    '</style>'+(extraHead||'')+
    '</head><body>'+(extraBody||'')+
    cert.cert_html+
    '</body></html>';
}

function _gerarPdf(cert, bgData){
  var iframe=null;
  function limpa(){ if(iframe&&iframe.parentNode) iframe.parentNode.removeChild(iframe); }

  var trabalho=(window.jspdf&&window.jspdf.jsPDF?Promise.resolve():_carregarScript(LIB_JSPDF)).then(function(){
    if(!window.jspdf||!window.jspdf.jsPDF) throw new Error('jsPDF indisponível');
    // Monta o certificado num iframe fora da tela: o CSS do certificado não
    // interfere no portal e a largura é sempre a de A4, mesmo no celular.
    iframe=document.createElement('iframe');
    iframe.setAttribute('aria-hidden','true');
    iframe.setAttribute('style','position:fixed;left:-20000px;top:0;width:'+CERT_LARGURA_PX+'px;height:800px;border:0;background:#fff');
    document.body.appendChild(iframe);
    var win=iframe.contentWindow, doc=win.document;
    doc.open(); doc.write(_htmlCertificado(cert, bgData)); doc.close();
    return new Promise(function(ok){
      if(doc.readyState==='complete') ok(); else win.addEventListener('load',function(){ok();});
    }).then(function(){ return _esperarRecursos(doc); })
      .then(function(){
        // 1ª opção: o próprio navegador desenha a página (texto e degradês idênticos).
        return _capturarNativo(win, doc).catch(function(e){
          // Alguns navegadores (ex.: Safari antigo) não permitem; usa o html2canvas.
          console.warn('[portal] captura nativa indisponível, usando html2canvas:',e);
          return _carregarScript(LIB_H2C, doc).then(function(){ return _capturarPaginas(win, doc); });
        });
      })
      .then(function(canvases){
        if(!canvases.length) throw new Error('Nenhuma página encontrada no certificado');
        var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
        var FW=297, FH=210;
        canvases.forEach(function(cv,i){
          if(i>0) pdf.addPage('a4','landscape');
          var w=FW, h=FW*cv.height/cv.width, x=0;
          // Proteção: se a folha for mais alta que o A4, reduz para caber (nunca corta).
          if(h>FH){ h=FH; w=FH*cv.width/cv.height; x=(FW-w)/2; }
          pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',x,0,w,h,undefined,'FAST');
        });
        pdf.save(_nomeArquivo(cert.teacher_name));
      });
  });
  return _comTempo(trabalho, 90000, 'Tempo esgotado ao gerar o PDF').then(limpa, function(e){ limpa(); throw e; });
}

// Espera fontes e imagens: o ajuste do verso foi medido com as fontes reais.
function _esperarRecursos(doc){
  var fontes=Promise.resolve();
  if(doc.fonts){
    var pedidos=['400 16px "DM Sans"','700 16px "DM Sans"','400 16px "Lora"','700 16px "Lora"','400 16px "EB Garamond"','700 16px "EB Garamond"'];
    fontes=Promise.all(pedidos.map(function(f){return doc.fonts.load(f).catch(function(){});}))
      .then(function(){return doc.fonts.ready;});
  }
  var imgs=[].slice.call(doc.images).map(function(img){
    if(img.complete) return Promise.resolve();
    return new Promise(function(ok){ img.onload=ok; img.onerror=ok; });
  });
  return _comTempo(Promise.all([fontes].concat(imgs)), 15000, 'recursos')
    .catch(function(){ /* segue mesmo assim */ })
    .then(function(){ return new Promise(function(ok){ setTimeout(ok,300); }); });
}

function _folhasDoCertificado(doc){
  return [].slice.call(doc.querySelectorAll('.pg,.p2')).filter(function(el){
    var p=el.parentElement;
    while(p){ if(p.classList&&(p.classList.contains('pg')||p.classList.contains('p2'))) return false; p=p.parentElement; }
    return true;
  });
}

function _paraDataUrl(url){
  if(!url||/^data:/i.test(url)) return Promise.resolve(url);
  return fetch(url,{mode:'cors'}).then(function(r){ if(!r.ok) throw new Error(url); return r.blob(); })
    .then(function(bl){ return new Promise(function(ok,falha){ var fr=new FileReader(); fr.onload=function(){ok(fr.result);}; fr.onerror=falha; fr.readAsDataURL(bl); }); });
}

// Fontes do Google embutidas (só latin e latin-ext), para o desenho nativo usar a fonte certa.
var _cacheFontesCss=null;
function _fontesEmbutidas(){
  if(_cacheFontesCss) return _cacheFontesCss;
  _cacheFontesCss=fetch(CERT_FONTS).then(function(r){ if(!r.ok) throw new Error('fontes'); return r.text(); })
    .then(function(css){
      var blocos=css.split('/*').map(function(p){return '/*'+p;}).filter(function(p){
        return /^\/\*\s*(latin|latin-ext)\s*\*\//.test(p);
      });
      if(!blocos.length) blocos=[css];
      return Promise.all(blocos.map(function(bl){
        var urls=[]; bl.replace(/url\(([^)]+)\)/g,function(_,u){urls.push(u.replace(/['"]/g,''));});
        return Promise.all(urls.map(_paraDataUrl)).then(function(datas){
          urls.forEach(function(u,i){ bl=bl.split(u).join(datas[i]); });
          return bl;
        });
      })).then(function(l){ return l.join('\n'); });
    });
  _cacheFontesCss.catch(function(){ _cacheFontesCss=null; });
  return _cacheFontesCss;
}

function _capturarNativo(win, doc){
  var folhas=_folhasDoCertificado(doc);
  if(!folhas.length) return Promise.reject(new Error('sem folhas'));
  // Imagens com endereço externo viram data: (uma imagem SVG não carrega nada de fora)
  var imgs=[].slice.call(doc.images).filter(function(im){ return im.src&&!/^data:/i.test(im.src); });
  return Promise.all(imgs.map(function(im){ return _paraDataUrl(im.src).then(function(d){ im.setAttribute('src',d); }); }))
  .then(function(){ return _fontesEmbutidas(); })
  .then(function(fontCss){
    var css=[].slice.call(doc.querySelectorAll('style')).map(function(st){return st.textContent;}).join('\n');
    if(/url\((?!['"]?data:)/i.test(css)) throw new Error('CSS com imagem externa');
    var bcs=win.getComputedStyle(doc.body);
    var escala=2;
    var saida=[];
    return folhas.reduce(function(cadeia, el){
      return cadeia.then(function(){
        var w=Math.ceil(el.getBoundingClientRect().width), h=Math.ceil(el.getBoundingClientRect().height);
        var xhtml=new XMLSerializer().serializeToString(el);
        var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+(w*escala)+'" height="'+(h*escala)+'" viewBox="0 0 '+w+' '+h+'">'+
          '<foreignObject x="0" y="0" width="'+w+'" height="'+h+'">'+
          '<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;background:#fff;color:'+bcs.color+';font-family:'+bcs.fontFamily.replace(/"/g,"'")+'">'+
          '<style>'+_escXml(fontCss+'\n'+css)+'</style>'+xhtml+
          '</div></foreignObject></svg>';
        return new Promise(function(ok,falha){
          var img=new Image();
          img.onload=function(){
            var desenhar=function(){
              try{
                var cv=document.createElement('canvas');
                cv.width=w*escala; cv.height=h*escala;
                var ctx=cv.getContext('2d');
                ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
                ctx.drawImage(img,0,0,cv.width,cv.height);
                cv.toDataURL('image/jpeg',0.5); // dispara erro aqui se o navegador bloquear
                ok(cv);
              }catch(e){ falha(e); }
            };
            // pequena espera para as fontes embutidas serem aplicadas no SVG
            setTimeout(desenhar, 150);
          };
          img.onerror=function(){ falha(new Error('SVG não carregou')); };
          img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
        }).then(function(cv){ saida.push(cv); });
      });
    }, Promise.resolve()).then(function(){ return saida; });
  });
}

function _escXml(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Reserva (navegadores que bloqueiam o desenho nativo): html2canvas.
function _capturarPaginas(win, doc){
  var folhas=_folhasDoCertificado(doc);
  _corrigirDegradesRadiais(win, doc);
  var escala=2;
  var saida=[];
  return folhas.reduce(function(cadeia, el){
    return cadeia.then(function(){
      return win.html2canvas(el,{scale:escala,backgroundColor:'#ffffff',useCORS:true,logging:false,
        windowWidth:CERT_LARGURA_PX,scrollX:0,scrollY:0})
        .then(function(cv){ saida.push(cv); });
    });
  }, Promise.resolve()).then(function(){ return saida; });
}

// O html2canvas desenha "radial-gradient(..., transparent)" puxando para cinza (a "bola").
// Troca por uma imagem equivalente desenhada no canvas.
function _corrigirDegradesRadiais(win, doc){
  [].slice.call(doc.querySelectorAll('*')).forEach(function(el){
    var bi=win.getComputedStyle(el).backgroundImage||'';
    if(bi.indexOf('radial-gradient(')!==0) return;
    var m=/radial-gradient\([^,]*,\s*(rgba?\([^)]*\))[^,]*,\s*rgba?\([^)]*\)\s*([\d.]+)%/.exec(bi);
    if(!m) return;
    var r=el.getBoundingClientRect(); if(!(r.width>0&&r.height>0)) return;
    var c=/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)/.exec(m[1]); if(!c) return;
    var cv=doc.createElement('canvas'); cv.width=Math.ceil(r.width); cv.height=Math.ceil(r.height);
    var ctx=cv.getContext('2d'), cx=cv.width/2, cy=cv.height/2;
    var raio=Math.sqrt(cx*cx+cy*cy)*parseFloat(m[2])/100;
    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,raio);
    g.addColorStop(0,'rgba('+c[1]+','+c[2]+','+c[3]+',1)');
    g.addColorStop(1,'rgba('+c[1]+','+c[2]+','+c[3]+',0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
    el.style.backgroundImage='url('+cv.toDataURL('image/png')+')';
    el.style.backgroundSize='100% 100%';
  });
}

// ── Plano B: impressão pelo navegador ─────────────────────────────────────────
function _limparAvisoImpressao(btn){
  var card=btn&&btn.closest?btn.closest('.cert-card'):null;
  var velho=card&&card.querySelector('.aviso-impressao');
  if(velho) velho.parentNode.removeChild(velho);
}

function _mostrarAvisoImpressao(btn, cert, bgData){
  var card=btn&&btn.closest?btn.closest('.cert-card'):null;
  if(!card){ alert('Não foi possível gerar o PDF. Tente novamente.'); return; }
  _limparAvisoImpressao(btn);
  var box=document.createElement('div');
  box.className='aviso-impressao';
  box.setAttribute('style','margin-top:10px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 12px;font-size:12px;color:#5d4037;line-height:1.5');
  box.innerHTML='⚠️ Não foi possível gerar o PDF automaticamente (conexão instável).<br>'+
    'Você pode abrir o certificado para salvar pela impressão. Na tela de impressão, escolha '+
    '<b>Salvar como PDF</b> e orientação <b>Paisagem</b>. Se aparecer escuro, desative o modo escuro do navegador.'+
    '<div style="margin-top:8px"><button type="button" class="download-btn" style="margin-top:0">🖨️ Abrir para salvar</button></div>';
  box.querySelector('button').onclick=function(){
    var w=window.open('','_blank');
    if(!w){ alert('Permita pop-ups para abrir o certificado.'); return; }
    _abrirCert(w, cert, bgData);
  };
  btn.parentNode.insertBefore(box, btn.nextSibling);
}

function _abrirCert(w, cert, bgData){
  var aviso='<div class="sme-aviso" style="font-family:\'DM Sans\',sans-serif;background:#fff8e1;border-bottom:1px solid #ffe082;padding:10px 14px;font-size:14px;color:#5d4037">'+
    'Na tela de impressão escolha <b>Salvar como PDF</b> e orientação <b>Paisagem</b>. Este aviso não sai no certificado.</div>';
  var script='<script>window.onload=function(){var f=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();f.then(function(){setTimeout(function(){window.print();},300);});};<\/script>';
  w.document.open();
  var _h=_htmlCertificado(cert, bgData, '', aviso), _k=_h.lastIndexOf('</body>');
  w.document.write(_h.slice(0,_k)+script+_h.slice(_k));
  w.document.close();
}
