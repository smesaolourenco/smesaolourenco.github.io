<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Certificados — SME São Lourenço do Oeste</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#1b5e20,#2e7d32);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
.card{background:#fff;border-radius:20px;padding:40px 36px;width:min(480px,100%);box-shadow:0 16px 64px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:22px;color:#1b5e20;font-weight:700;margin-top:12px}
.logo p{font-size:13px;color:#777;margin-top:4px}
.inp{width:100%;padding:12px 14px;border:2px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;transition:border .2s}
.inp:focus{outline:none;border-color:#2e7d32}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;font-family:inherit}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.results{margin-top:24px}
.cert-card{background:#f9f9f9;border:1px solid #e0e0e0;border-radius:12px;padding:16px 20px;margin-bottom:12px}
.cert-card h3{font-size:15px;color:#1b5e20;margin-bottom:6px}
.cert-card p{font-size:13px;color:#666;margin-bottom:2px}
.cert-card .meta{display:flex;gap:16px;margin-top:8px;font-size:12px;color:#999}
.download-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 16px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.download-btn:hover{background:#1b5e20}
.empty{text-align:center;padding:32px;color:#aaa;font-size:14px}
.error{color:#c62828;font-size:13px;margin-top:8px;text-align:center}
.loading{text-align:center;padding:20px;color:#2e7d32}
.footer{margin-top:32px;text-align:center;color:rgba(255,255,255,.6);font-size:12px}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1b5e20,#388e3c);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:28px">🎓</div>
    <h1>Portal de Certificados</h1>
    <p>Secretaria Municipal de Educação<br>São Lourenço do Oeste — SC</p>
  </div>

  <div id="code-banner" style="display:none;background:#e8f5e9;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#1b5e20;font-weight:600;text-align:center"></div>

  <div>
    <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:6px">Digite seu CPF para buscar seus certificados</label>
    <input id="cpf-input" class="inp" type="text" placeholder="000.000.000-00" maxlength="14" oninput="formatCPF(this)">
    <div id="error-msg" class="error" style="display:none"></div>
    <button class="btn" onclick="buscarCertificados()" id="btn-buscar">🔍 Buscar Certificados</button>
  </div>

  <div id="results" class="results" style="display:none"></div>
</div>

<div class="footer">
  Sistema de Certificados SME &copy; 2026
</div>

<script>
var SUPA_URL='https://jabgimlqhgsmaoncfaon.supabase.co';
var SUPA_KEY='sb_publishable_pdd6Ur198pja2PCgXjrZvg_TkITQdpU';

function formatCPF(el){
  var v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>9) v=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if(v.length>6) v=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if(v.length>3) v=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  el.value=v;
  // Allow Enter key
  el.onkeydown=function(e){if(e.key==='Enter')buscarCertificados();};
}

function buscarCertificados(){
  var cpf=document.getElementById('cpf-input').value.replace(/\D/g,'');
  var errEl=document.getElementById('error-msg');
  errEl.style.display='none';
  
  if(cpf.length!==11){
    errEl.textContent='Por favor, digite um CPF válido com 11 dígitos.';
    errEl.style.display='block';
    return;
  }
  
  var btn=document.getElementById('btn-buscar');
  btn.disabled=true;
  btn.textContent='⏳ Buscando...';
  
  var resultsEl=document.getElementById('results');
  resultsEl.style.display='block';
  resultsEl.innerHTML='<div class="loading">⏳ Buscando seus certificados...</div>';
  
  fetch(SUPA_URL+'/rest/v1/certificados?teacher_cpf=eq.'+cpf+'&order=created_at.desc',{
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY
    }
  })
  .then(function(r){return r.json();})
  .then(function(certs){
    btn.disabled=false;
    btn.textContent='🔍 Buscar Certificados';
    
    if(!certs||!certs.length){
      resultsEl.innerHTML='<div class="empty">📋 Nenhum certificado encontrado para este CPF.<br><small>Se você participou de uma formação, aguarde a emissão pela SME.</small></div>';
      return;
    }
    
    var html='<div style="font-size:13px;color:#2e7d32;font-weight:600;margin-bottom:12px">✅ '+certs.length+' certificado(s) encontrado(s) para:<br><span style="font-size:15px;color:#333">'+certs[0].teacher_name+'</span></div>';
    
    certs.forEach(function(cert,i){
      html+='<div class="cert-card">'+
        '<h3>📜 '+escHtml(cert.event_name||'Formação')+'</h3>'+
        '<div class="meta">'+
          '<span>⏱ '+cert.hours+'h</span>'+
          '<span>📅 '+escHtml(cert.issue_date||'')+'</span>'+
          (cert.validation_code?'<span>🔑 '+escHtml(cert.validation_code)+'</span>':'')+
        '</div>'+
        '<button class="download-btn" onclick="downloadCert('+i+')">⬇️ Baixar PDF</button>'+
      '</div>';
    });
    
    resultsEl.innerHTML=html;
    window._certs=certs;
  })
  .catch(function(err){
    btn.disabled=false;
    btn.textContent='🔍 Buscar Certificados';
    resultsEl.innerHTML='<div class="empty">❌ Erro ao buscar certificados. Tente novamente.</div>';
    console.error(err);
  });
}

function escHtml(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Validação por código (QR) ──────────────────────────────────────────────
// Ao abrir o portal, se a URL tiver ?codigo=XXXX, busca e mostra aquele certificado direto.
function _getParam(name){
  var m=new RegExp('[?&]'+name+'=([^&]+)').exec(window.location.search||'');
  return m?decodeURIComponent(m[1]):'';
}

function validarPorCodigo(codigo){
  var resultsEl=document.getElementById('results');
  resultsEl.style.display='block';
  resultsEl.innerHTML='<div class="loading">⏳ Validando certificado...</div>';
  var lbl=document.getElementById('code-banner');
  if(lbl){lbl.style.display='block';lbl.textContent='🔑 Validando código: '+codigo;}

  fetch(SUPA_URL+'/rest/v1/certificados?validation_code=eq.'+encodeURIComponent(codigo),{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  })
  .then(function(r){return r.json();})
  .then(function(certs){
    if(!certs||!certs.length){
      resultsEl.innerHTML='<div class="empty">⚠️ Nenhum certificado encontrado com o código <b>'+escHtml(codigo)+'</b>.<br><small>Verifique o código ou busque pelo seu CPF abaixo.</small></div>';
      return;
    }
    var cert=certs[0];
    var html='<div style="background:#e8f5e9;border:1px solid #a5d6a7;border-radius:12px;padding:14px 18px;margin-bottom:16px">'+
      '<div style="font-size:14px;color:#1b5e20;font-weight:700;margin-bottom:4px">✅ Certificado autêntico</div>'+
      '<div style="font-size:12px;color:#555">Este código consta na base da Secretaria Municipal de Educação.</div>'+
      '</div>';
    html+='<div class="cert-card">'+
      '<h3>📜 '+escHtml(cert.event_name||'Formação')+'</h3>'+
      '<p style="font-size:14px;color:#333;font-weight:600">'+escHtml(cert.teacher_name||'')+'</p>'+
      '<div class="meta">'+
        '<span>⏱ '+cert.hours+'h</span>'+
        '<span>📅 '+escHtml(cert.issue_date||'')+'</span>'+
        '<span>🔑 '+escHtml(cert.validation_code||'')+'</span>'+
      '</div>'+
      '<button class="download-btn" onclick="downloadCert(0)">⬇️ Baixar PDF</button>'+
    '</div>';
    resultsEl.innerHTML=html;
    window._certs=[cert];
  })
  .catch(function(err){
    resultsEl.innerHTML='<div class="empty">❌ Erro ao validar o certificado. Tente novamente.</div>';
    console.error(err);
  });
}

window.addEventListener('DOMContentLoaded',function(){
  var codigo=_getParam('codigo');
  if(codigo){ validarPorCodigo(codigo); }
});

function downloadCert(idx){
  var cert=window._certs&&window._certs[idx];
  if(!cert||!cert.cert_html){
    alert('Certificado ainda não disponível para download. Por favor, solicite à SME.');
    return;
  }
  // A borda é guardada uma vez no evento (não em cada certificado) — busca e aplica agora.
  if(cert.event_id){
    fetch(SUPA_URL+'/rest/v1/events?select=bg_data&id=eq.'+encodeURIComponent(cert.event_id),{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    }).then(function(r){return r.json();}).then(function(rows){
      var bg=rows&&rows[0]&&rows[0].bg_data;
      _abrirCert(cert, bg||'');
    }).catch(function(){ _abrirCert(cert,''); });
  } else {
    _abrirCert(cert,'');
  }
}

function _abrirCert(cert, bgData){
  var w=window.open('','_blank');
  if(!w){alert('Permita pop-ups para baixar o certificado.');return;}
  var bgCss = bgData ? '.pg{background-image:url(\''+bgData+'\');background-size:100% 100%;background-position:center;background-repeat:no-repeat}' : '';
  
  w.document.write('<!DOCTYPE html><html><head>'+
    '<meta charset="UTF-8">'+
    '<title>Certificado — '+escHtml(cert.teacher_name)+'</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">'+
    '<style>'+
    'body{margin:0;padding:0}'+
    '@media print{@page{size:A4 landscape;margin:0}body{margin:0}}'+
    bgCss+
    '</style>'+
    '</head><body>'+
    cert.cert_html+
    '<script>window.onload=function(){window.print();};<\/script>'+
    '</body></html>');
  w.document.close();
}
</script>
</body>
</html>
